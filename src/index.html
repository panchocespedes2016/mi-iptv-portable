<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiIPTV Portable</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">📺 MiIPTV</div>
    <div id="active-source" class="source">Sin fuente</div>
    <nav>
      <button class="nav-btn active" data-view="live">📡 TV en vivo</button>
      <button class="nav-btn" data-view="epg">🗓 Guía</button>
      <button class="nav-btn" data-view="movies">🎬 Películas</button>
      <button class="nav-btn" data-view="series">📺 Series</button>
      <button class="nav-btn" data-view="favs">⭐ Favoritos</button>
      <button class="nav-btn" data-view="settings">⚙ Ajustes</button>
    </nav>
    <div class="version">v…</div>
  </aside>
  <main id="content">
    <section id="view-live" class="view active">
      <div class="live-layout">
        <div id="groups"></div>
        <div class="live-main">
          <input id="live-search" placeholder="🔍 Buscar canal…">
          <div id="live-list"></div>
        </div>
      </div>
    </section>
    <section id="view-epg" class="view"><h2>Guía de programación</h2><div id="epg-grid"></div></section>
    <section id="view-movies" class="view">
      <h2>Películas</h2>
      <input id="movies-search" placeholder="🔍 Buscar película…">
      <div id="vod-cats" class="catbar"></div>
      <div id="movies-list"></div>
      <div id="movie-detail" class="hidden"></div>
    </section>
    <section id="view-series" class="view">
      <h2>Series</h2>
      <input id="series-search" placeholder="🔍 Buscar serie…">
      <div id="series-cats" class="catbar"></div>
      <div id="series-list"></div>
      <div id="series-detail" class="hidden"></div>
    </section>
    <section id="view-favs" class="view"><h2>Favoritos</h2><div id="favs-list"></div></section>
    <section id="view-settings" class="view">
      <h2>Ajustes</h2>
      <h3>Mis fuentes</h3>
      <div id="profiles"></div>
      <h3>Agregar fuente</h3>
      <select id="pf-type">
        <option value="xtream">Xtream Codes</option>
        <option value="m3u">Lista m3u</option>
      </select>
      <div id="pf-fields"></div>
      <h3>Timeshift en RAM</h3>
      <p class="hint">Pausa y retrocede la TV en vivo. El buffer vive solo en memoria RAM, no graba nada al disco. Aplica al próximo canal que abras.</p>
      <select id="ts-minutes">
        <option value="0">Desactivado</option>
        <option value="15">15 minutos</option>
        <option value="30">30 minutos</option>
        <option value="60">60 minutos</option>
        <option value="120">120 minutos</option>
      </select>
      <p class="hint" id="datadir"></p>
    </section>
  </main>
</div>
<div id="player-modal" class="hidden">
  <video id="video" controls playsinline></video>
  <div class="player-bar">
    <span id="now-playing"></span>
    <span id="ts-delay" class="hidden"></span>
    <button id="btn-live" class="hidden live-btn">● EN VIVO</button>
    <button id="btn-vlc">Abrir en VLC</button>
    <button id="btn-close">✕ Cerrar</button>
  </div>
</div>
<div id="toast"></div>
<div id="info-modal" class="hidden">
  <div class="info-card">
    <h3 id="info-title"></h3>
    <div id="info-meta" class="meta"></div>
    <p id="info-desc"></p>
    <button id="info-close">Cerrar</button>
  </div>
</div>
<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
